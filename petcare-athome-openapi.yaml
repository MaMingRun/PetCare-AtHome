        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/PetVO'}}}}]}}}

  # ============================ 管理后台：财务 ============================
  /admin/finance/reconciliations:
