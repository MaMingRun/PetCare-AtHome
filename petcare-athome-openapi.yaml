      parameters:
        - {name: status, in: query, schema: {type: string, enum: [SUBMITTED, REVIEWING, APPROVED, REJECTED]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/ProviderApplicationVO'}}}}]}}}

  /admin/providers/applications/{id}/audit:
    post:
      tags: [管理后台-服务师管理]
      operationId: adminProviderApplicationAudit
      summary: 入驻审核
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: {type: boolean}
                rejectReason: {type: string, nullable: true}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/providers/{id}:
    get:
      tags: [管理后台-服务师管理]
      operationId: adminProviderGet
      summary: 服务师详情
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/AdminProviderDetailVO'}}}

  /admin/providers/{id}/certifications/audit:
    post:
      tags: [管理后台-服务师管理]
      operationId: adminProviderCertAudit
      summary: 认证项审核
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certType, approved]
              properties:
                certType: {type: string, enum: [REAL_NAME, FACE, HEALTH_CERT, NO_CRIMINAL, QUALIFICATION, PLATFORM_TRAINING]}
                approved: {type: boolean}
                remark: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/providers/{id}/punishments:
    post:
      tags: [管理后台-服务师管理]
      operationId: adminProviderPunishment
      summary: 奖惩与封禁
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, reason]
              properties:
                type: {type: string, enum: [WARNING, FINE, SUSPEND, BAN, REWARD]}
                reason: {type: string}
                amount: {type: integer, description: 罚款/奖励金额（分），可选}
                durationDays: {type: integer, description: 封禁天数，可选}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/providers/{id}/deposit:
    get:
      tags: [管理后台-服务师管理]
      operationId: adminProviderDepositGet
      summary: 保证金台账（单服务师）
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/DepositLedgerVO'}}}

