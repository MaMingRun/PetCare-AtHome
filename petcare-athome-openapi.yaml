      tags: [管理后台-财务]
      operationId: adminReconciliationList
      summary: 微信支付对账
      parameters:
        - {name: billDate, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/ReconciliationVO'}}}

  /admin/finance/settlement-rules:
    get:
      tags: [管理后台-财务]
      operationId: adminSettlementRuleGet
      summary: 查询分账规则
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/SettlementRuleVO'}}}
    put:
      tags: [管理后台-财务]
      operationId: adminSettlementRuleUpdate
      summary: 配置分账规则
      description: 平台向服务师收取订单金额 15%-20% 服务费（含获客与结算成本）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SettlementRuleDTO'}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/finance/withdrawals:
    get:
      tags: [管理后台-财务]
      operationId: adminWithdrawalList
      summary: 提现审核列表
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [APPLIED, APPROVED, PAID, REJECTED]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/WithdrawalVO'}}}}]}}}

  /admin/finance/withdrawals/{id}/audit:
    post:
      tags: [管理后台-财务]
      operationId: adminWithdrawalAudit
      summary: 提现审核
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: {type: boolean}
                remark: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/finance/refunds:
    post:
      tags: [管理后台-财务]
      operationId: adminRefundExecute
      summary: 平台主动退款
      description: 平台侧直接发起并执行的退款（改派失败全额退、先行赔付后追退等）；与退款审批不同，无用户申请前置。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, amount]
              properties:
                orderId: {type: integer, format: int64}
                amount: {type: integer, description: 退款金额（分）}
                remark: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/finance/deposits:
    get:
      tags: [管理后台-财务]
      operationId: adminDepositList
      summary: 保证金台账
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/DepositLedgerVO'}}}}]}}}

  # ============================ 管理后台：客诉工单 ============================
  /admin/complaints:
    get:
      tags: [管理后台-客诉工单]
      operationId: adminComplaintList
      summary: 工单列表
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [PENDING, PROCESSING, RESOLVED, CLOSED]}}
        - {name: type, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/ComplaintVO'}}}}]}}}

  /admin/complaints/{id}:
    get:
      tags: [管理后台-客诉工单]
      operationId: adminComplaintGet
      summary: 工单详情
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/ComplaintDetailVO'}}}

  /admin/complaints/{id}/assign:
    post:
      tags: [管理后台-客诉工单]
      operationId: adminComplaintAssign
      summary: 工单流转
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              properties:
                assigneeId: {type: integer, format: int64, description: 客服账号 id}
                remark: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/complaints/{id}/resolve:
    post:
      tags: [管理后台-客诉工单]
      operationId: adminComplaintResolve
      summary: 处理与赔付方案
      description: 客服 24 小时内介入；可冻结结算。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: {type: string}
                compensationAmount: {type: integer, description: 赔付金额（分）}
                freezeSettlement: {type: boolean, default: false}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/complaints/{id}/advance-payment:
    post:
      tags: [管理后台-客诉工单]
      operationId: adminComplaintAdvancePayment
      summary: 先行赔付
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: {type: integer, description: 先行赔付金额（分）}
                remark: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  # ============================ 管理后台：审计日志 ============================
  /admin/roles:
    get:
      tags: [管理后台-审计日志]
      operationId: adminRoleList
      summary: 角色列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/AdminRoleVO'}}}}

  /admin/roles/{id}:
    put:
      tags: [管理后台-审计日志]
      operationId: adminRoleUpdate
      summary: 配置角色权限
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions: {type: array, items: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/audit-logs:
    get:
      tags: [管理后台-审计日志]
      operationId: adminAuditLogList
      summary: 敏感操作审计日志
      description: 查看用户入户信息、退款、封禁等敏感操作全量留痕。
      parameters:
        - {name: operatorId, in: query, schema: {type: integer, format: int64}}
        - {name: action, in: query, schema: {type: string}}
        - {name: begin, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/AuditLogVO'}}}}]}}}

  # ============================ 回调 ============================
  /callback/wechat/pay:
    post:
      tags: [回调]
      operationId: callbackWechatPay
      summary: 微信支付结果通知
      description: 微信支付异步通知；验签后按商户单号路由业务类型：ORDER-更新订单支付状态并进入派单；DEPOSIT-确认保证金缴纳并写入台账。需在 5s 内返回成功。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: {type: string, description: 微信支付通知 id}
                event_type: {type: string}
                resource: {type: object, description: 加密的支付结果密文}
      responses:
        '200':
          description: 处理成功
          content:
            application/json:
              schema: {type: object, properties: {code: {type: string, example: SUCCESS}, message: {type: string, example: 成功}}}

  /callback/wechat/face-verify:
    post:
      tags: [回调]
      operationId: callbackFaceVerify
      summary: 人脸核身结果通知
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bizId: {type: string}
                passed: {type: boolean}
                reason: {type: string, nullable: true}
      responses:
        '200':
          description: 处理成功
          content:
            application/json:
              schema: {type: object, properties: {code: {type: string, example: SUCCESS}}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录后下发的 JWT；请求头 Authorization Bearer token

  parameters:
    PathId:
      name: id
      in: path
      required: true
      description: 资源主键
      schema: {type: integer, format: int64}
    PathDayId:
      name: dayId
      in: path
      required: true
      description: 多日订单子项 OrderDay 主键
      schema: {type: integer, format: int64}
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页条数
      schema: {type: integer, minimum: 1, maximum: 100, default: 10}

  responses:
    OkVoid:
      description: 操作成功
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Result'}

  schemas:
    # ---------- 通用 ----------
    Result:
      type: object
      description: 统一响应体
      properties:
        code: {type: integer, example: 1, description: 1 成功 0 失败}
        msg: {type: string, nullable: true, description: 提示信息}
        data: {nullable: true, description: 业务数据}
    PageResult:
      type: object
      description: 分页结果基类
      properties:
        total: {type: integer, format: int64, description: 总记录数}
        records: {type: array, items: {}, description: 数据列表}
    FileBizType:
      type: string
      description: 文件业务类型
      enum: [PET_AVATAR, PET_VACCINE, SERVICE_RECORD, SERVICE_REPORT, PROVIDER_ID_CARD, PROVIDER_HEALTH_CERT, PROVIDER_QUALIFICATION, COMPLAINT_EVIDENCE, REVIEW_IMAGE, OTHER]
    PresignVO:
      type: object
      description: OSS 直传凭证
      properties:
        uploadUrl: {type: string, description: 直传地址}
        method: {type: string, example: PUT}
        headers: {type: object, additionalProperties: {type: string}, description: 直传所需请求头}
        objectKey: {type: string, description: 对象 Key}
        fileUrl: {type: string, description: 访问地址}
        expireAt: {type: string, format: date-time, description: 凭证过期时间}
    DictItem:
      type: object
      properties:
        key: {type: string}
        value: {type: string}
        sort: {type: integer}

    # ---------- 用户端 ----------
    LoginVO:
      type: object
      description: 登录结果
      properties:
        token: {type: string, description: JWT}
        userId: {type: integer, format: int64, nullable: true}
        openid: {type: string, nullable: true}
        needBindPhone: {type: boolean, description: 是否需要绑定手机号}
    UserProfileVO:
      type: object
      properties:
        id: {type: integer, format: int64}
        nickname: {type: string}
        avatar: {type: string, nullable: true}
        phone: {type: string, description: 脱敏手机号}
    AddressVO:
      type: object
      description: 地址与入户方式
      properties:
        id: {type: integer, format: int64}
        contactName: {type: string}
        contactPhone: {type: string}
        city: {type: string}
        district: {type: string}
        community: {type: string, description: 小区}
        detail: {type: string, description: 门牌等详细地址}
        longitude: {type: number, format: double}
        latitude: {type: number, format: double}
        entryMode: {type: string, enum: [SMART_LOCK, PROPERTY, KEY_DEPOSIT, AT_HOME], description: 入户方式}
        entryNoteMasked: {type: string, nullable: true, description: 入户凭证脱敏展示}
        isDefault: {type: boolean}
    AddressSaveDTO:
      type: object
      required: [contactName, contactPhone, community, detail, entryMode]
      properties:
        contactName: {type: string}
        contactPhone: {type: string}
        city: {type: string}
        district: {type: string}
        community: {type: string}
        detail: {type: string}
        longitude: {type: number, format: double}
        latitude: {type: number, format: double}
        entryMode: {type: string, enum: [SMART_LOCK, PROPERTY, KEY_DEPOSIT, AT_HOME]}
        entrySecret: {type: string, nullable: true, description: 入户凭证（智能门锁临时密码/钥匙寄存位置等），加密存储}
        isDefault: {type: boolean}
    PetVO:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string}
        species: {type: string, description: 物种}
        breed: {type: string, nullable: true, description: 品种}
        gender: {type: string, enum: [MALE, FEMALE, UNKNOWN]}
        birthday: {type: string, format: date, nullable: true}
        ageText: {type: string, nullable: true}
        weightKg: {type: number, format: double, nullable: true}
        sterilized: {type: boolean, description: 是否绝育}
        avatar: {type: string, nullable: true}
        personalityTags: {type: array, items: {type: string}, description: 性格标签}
        personalityNote: {type: string, nullable: true}
        allergies: {type: string, nullable: true, description: 过敏与禁忌}
        chronicDisease: {type: string, nullable: true, description: 慢病与用药}
        feedingInstruction:
          type: object
          nullable: true
          description: 喂养指令，服务时自动带入 SOP
          properties:
            dailyFoodGram: {type: integer, nullable: true, description: 每日粮量 g}
            feedTimes: {type: integer, nullable: true, description: 每日喂食次数}
            waterNote: {type: string, nullable: true}
            litterOrWalkNote: {type: string, nullable: true, description: 猫砂或遛弯习惯}
        vaccinations:
          type: array
          items: {$ref: '#/components/schemas/VaccinationDTO'}
        completeness: {type: integer, nullable: true, description: 档案完整度百分比}
    PetSaveDTO:
      type: object
      required: [name, species]
      properties:
        name: {type: string}
        species: {type: string}
        breed: {type: string}
        gender: {type: string, enum: [MALE, FEMALE, UNKNOWN]}
        birthday: {type: string, format: date}
        weightKg: {type: number, format: double}
        sterilized: {type: boolean}
        avatar: {type: string}
        personalityTags: {type: array, items: {type: string}}
        personalityNote: {type: string}
        allergies: {type: string}
        chronicDisease: {type: string}
        feedingInstruction:
          type: object
          properties:
            dailyFoodGram: {type: integer}
            feedTimes: {type: integer}
            waterNote: {type: string}
            litterOrWalkNote: {type: string}
    VaccinationDTO:
      type: object
      properties:
        id: {type: integer, format: int64, readOnly: true}
        vaccineName: {type: string}
        vaccinatedAt: {type: string, format: date}
        nextAt: {type: string, format: date, nullable: true}
        certificateUrl: {type: string, nullable: true, description: 疫苗本照片}
    ServiceVO:
      type: object
      description: 服务类目 SKU 简要
      properties:
        id: {type: integer, format: int64}
        name: {type: string, example: 上门喂养}
        category: {type: string, enum: [FEEDING, GROOMING, MEDICAL]}
        coverUrl: {type: string}
        priceFrom: {type: integer, description: 起步价（分）}
        durationMinutes: {type: integer}
        tags: {type: array, items: {type: string}}
    ServiceDetailVO:
      allOf:
        - $ref: '#/components/schemas/ServiceVO'
        - type: object
          properties:
            contentItems: {type: array, items: {type: string}, description: 服务内容清单}
            priceRules:
              type: array
              description: 计价规则
              items:
                type: object
                properties:
                  ruleType: {type: string, enum: [BASE, EXTRA_PET, WEIGHT, DISTANCE]}
                  label: {type: string}
                  amount: {type: integer, description: 金额（分）}
            notice: {type: string, description: 服务须知}
            refundPolicy: {type: string, description: 退款规则}
    PriceCalcDTO:
      type: object
      required: [serviceId, petIds, addressId]
      properties:
        serviceId: {type: integer, format: int64}
        petIds: {type: array, items: {type: integer, format: int64}}
        addressId: {type: integer, format: int64}
        days: {type: integer, default: 1, description: 连续天数}
    PriceCalcVO:
      type: object
      properties:
        baseAmount: {type: integer, description: 基础金额（分）}
        extraAmount: {type: integer, description: 加价金额（分）}
        totalAmount: {type: integer, description: 合计（分）}
        breakdown:
          type: array
          items:
            type: object
            properties:
              label: {type: string}
              amount: {type: integer}
    TimeSlotVO:
      type: object
      properties:
        date: {type: string, format: date}
        slot: {type: string, example: '14:00-15:00'}
        available: {type: boolean}
        remain: {type: integer, description: 剩余可接单名额}
    ProviderBriefVO:
      type: object
      properties:
        id: {type: integer, format: int64}
        displayName: {type: string, description: 脱敏姓名}
        avatar: {type: string}
        years: {type: integer, description: 从业年限}
        badges: {type: array, items: {type: string}, description: 认证徽章}
        specialties: {type: array, items: {type: string}}
        serviceCount: {type: integer}
        rating: {type: number, format: double}
        distanceKm: {type: number, format: double, nullable: true}
        favorited: {type: boolean}
    ProviderDetailVO:
      allOf:
        - $ref: '#/components/schemas/ProviderBriefVO'
        - type: object
          properties:
            intro: {type: string}
            certifications: {type: array, items: {$ref: '#/components/schemas/CertificationStatusVO'}}
            gallery: {type: array, items: {type: string}, description: 历史服务相册（脱敏）}
            ratingDetail:
              type: object
              properties:
                professional: {type: number, format: double}
                punctual: {type: number, format: double}
                communication: {type: number, format: double}
                care: {type: number, format: double}
    ReviewVO:
      type: object
      properties:
        id: {type: integer, format: int64}
        orderId: {type: integer, format: int64}
        userName: {type: string, description: 脱敏用户名}
        userAvatar: {type: string}
        scoreProfessional: {type: integer}
        scorePunctual: {type: integer}
        scoreCommunication: {type: integer}
        scoreCare: {type: integer}
        avgScore: {type: number, format: double}
        content: {type: string}
        images: {type: array, items: {type: string}}
        createdAt: {type: string}
    OrderStatus:
      type: string
      description: 订单状态。SETTLING=已确认·待评价（开放 72 小时评价窗口）；REVIEWED（已评价）与 FINISHED（已完成·未评价，评价窗口超时由定时任务归档）为正常完结的终态
      enum: [PENDING_PAY, PENDING_ACCEPT, ACCEPTED, DEPARTED, ARRIVED, SERVING, PENDING_CONFIRM, SETTLING, REVIEWED, FINISHED, CANCELLED, REFUNDING, REFUNDED, DISPUTED]
    OrderCreateDTO:
      type: object
      required: [serviceId, petIds, addressId, startDate, timeSlot]
      properties:
        serviceId: {type: integer, format: int64}
        providerId: {type: integer, format: int64, nullable: true, description: 指定服务师，不传则平台派单}
        petIds: {type: array, items: {type: integer, format: int64}}
        addressId: {type: integer, format: int64}
        entryMode: {type: string, enum: [SMART_LOCK, PROPERTY, KEY_DEPOSIT, AT_HOME]}
        startDate: {type: string, format: date}
        days: {type: integer, default: 1, description: 连续多日预约天数}
        timeSlot: {type: string, example: '14:00-15:00'}
        remark: {type: string, nullable: true}
    OrderCreateVO:
      type: object
      properties:
        orderId: {type: integer, format: int64}
        orderNo: {type: string}
        totalAmount: {type: integer, description: 应付金额（分）}
        payExpireAt: {type: string, description: 支付截止时间（下单后 15 分钟）}
    OrderVO:
      type: object
      properties:
        id: {type: integer, format: int64}
        orderNo: {type: string}
        status: {$ref: '#/components/schemas/OrderStatus'}
        statusText: {type: string}
        serviceName: {type: string}
        coverUrl: {type: string}
        petNames: {type: array, items: {type: string}}
        startDate: {type: string, format: date}
        days: {type: integer, description: 连续天数}
        timeSlot: {type: string}
        totalAmount: {type: integer, description: 金额（分）}
        provider: {$ref: '#/components/schemas/ProviderBriefVO'}
        createdAt: {type: string}
    OrderDetailVO:
      allOf:
        - $ref: '#/components/schemas/OrderVO'
        - type: object
          properties:
            address: {$ref: '#/components/schemas/AddressVO'}
            pets: {type: array, items: {$ref: '#/components/schemas/PetVO'}}
            serviceAmount: {type: integer, description: 服务金额（分）}
            discountAmount: {type: integer, description: 优惠金额（分）}
            payAmount: {type: integer, description: 实付（分）}
            payTime: {type: string, nullable: true}
            cancelRuleText: {type: string, description: 取消规则说明}
            providerContact: {type: string, nullable: true, description: 虚拟号，仅已接单后可见}
            dayList: {type: array, items: {$ref: '#/components/schemas/OrderDayVO'}, description: 多日订单子项}
            canCancel: {type: boolean}
            canConfirm: {type: boolean}
