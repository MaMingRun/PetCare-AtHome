openapi: 3.0.3
info:
  title: 宠爱到家（PetCare AtHome）接口文档
  version: 1.1.0
  description: |
    MVP（P0）接口定义，覆盖 **用户端小程序 / 服务师端小程序 / 管理后台** 三端。本版已收敛至 MVP 范围：
    V1.1/V2.0 功能（会员、次卡、优惠券、积分、保险投保、数据看板等）不在此文档内，见「MVP 明确不做」。

    ## 核心链路（建议按此顺序实现与复习）
    1. **下单**：`GET /user/services`、`POST /user/services/price-calc` → `POST /user/orders`
    2. **支付**：`POST /user/orders/{id}/pay` + 回调 `POST /callback/wechat/pay`
    3. **派单**：`POST /admin/orders/{id}/dispatch` → `POST /provider/orders/{id}/accept`
    4. **打卡**：`POST /provider/orders/{id}/checkin`（定位偏差校验）
    5. **留痕**：`GET /provider/orders/{id}/sop` + `POST /provider/orders/{id}/records`
    6. **报告**：`POST /provider/orders/{id}/report` → `GET /user/orders/{id}/report`
    7. **确认**：`POST /user/orders/{id}/confirm`（72h 超时自动确认）
    8. **结算**：`GET /provider/wallet/settlements`（T+1）→ `POST /provider/withdrawals`
    9. **评价**：`POST /user/orders/{id}/review`（窗口 72h，超时未评自动归档）

    链路之外的配套能力（可后置）：入驻认证、地址与入户凭证、收藏/指定服务师、排班、申诉工单、退款与提现审核、财务对账、订单告警、权限与审计、文件直传与字典。

    ## 通用约定
    - **响应体**：所有接口统一返回 `Result`：`{ "code": 1, "msg": null, "data": ... }`，`code=1` 成功、`code=0` 失败（`msg` 为错误信息）。
    - **分页**：请求参数 `page`（页码，从 1 开始）、`pageSize`（每页条数，默认 10）；响应 `data` 为 `PageResult`：`{ "total": 100, "records": [...] }`。
    - **鉴权**：三端均使用 JWT，放在 `Authorization: Bearer <token>` 请求头。登录接口无需鉴权。
    - **金额**：一律使用 **分**（integer），如 6800 表示 68.00 元。
    - **时间**：`yyyy-MM-dd HH:mm:ss`；日期 `yyyy-MM-dd`。
    - **图片/视频**：小程序端先调 `POST /common/files/presign` 获取 OSS 直传凭证，上传成功后把可访问 URL 提交给业务接口；服务影像需带水印（时间 + 定位），由客户端合成。
    - **幂等**：`POST /user/orders`、`POST /user/orders/{id}/pay`、`POST /provider/withdrawals` 需带 `Idempotency-Key` 请求头防重复提交。
    - **视频时长**：≤ 60s。

    ## 本地开发（无企业资质）
    小程序端用**测试号** + 开发者工具「不校验合法域名」直连本地后端 `http://127.0.0.1:8080`。微信支付、手机号快捷绑定、人脸核身、虚拟号、OSS 直传在 dev 环境由 **Mock 网关**替代（接口形状不变，详见 PRD §11）：
    支付模拟成功并驱动状态流转（前端跳过 `wx.requestPayment`）、手机号手动输入、核身自动通过、虚拟号返回测试号码、文件存本地。
    `/callback/wechat/pay` 保留，可用 curl 重放回调报文测试验签与幂等。

    ## MVP 明确不做
    会员体系、次卡/套餐、积分、优惠券、定金/尾款模式、电子发票、服务报告分享、服务师回评与评价激励、实时视频通话、虚拟号 IM、保险自动投保、数据看板、内容运营配置、多城市。
servers:
  - url: http://localhost:8080
    description: 本地开发
  - url: https://api.petcare-athome.com
    description: 生产环境
tags:
  - {name: 通用, description: 文件上传、字典等公共能力}
  - {name: 用户端-认证与账户}
  - {name: 用户端-地址与入户方式}
  - {name: 用户端-宠物档案}
  - {name: 用户端-服务与预约}
  - {name: 用户端-服务师}
  - {name: 用户端-订单与支付}
  - {name: 用户端-服务过程}
  - {name: 用户端-评价}
  - {name: 用户端-申诉与消息}
  - {name: 用户端-个人中心}
  - {name: 服务师端-入驻与认证}
  - {name: 服务师端-工作台与接单}
  - {name: 服务师端-服务执行}
  - {name: 服务师端-收入与提现}
  - {name: 管理后台-认证与权限}
  - {name: 管理后台-订单调度}
  - {name: 管理后台-服务师管理}
  - {name: 管理后台-用户与宠物}
  - {name: 管理后台-财务}
  - {name: 管理后台-客诉工单}
  - {name: 管理后台-审计日志}
  - {name: 回调, description: 第三方服务端回调，非小程序调用}
security:
  - bearerAuth: []

paths:
  # ============================ 通用 ============================
  /common/files/presign:
    post:
      tags: [通用]
      operationId: commonFilePresign
      summary: 获取 OSS 直传凭证
      description: 返回 OSS 直传所需的临时签名凭证，客户端据此直传文件，避免经过业务服务端。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bizType, fileName]
              properties:
                bizType: {$ref: '#/components/schemas/FileBizType'}
                fileName: {type: string, example: "IMG_0001.jpg"}
                contentType: {type: string, example: "image/jpeg"}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/PresignVO'}}}

  /common/dicts/{type}:
    get:
      tags: [通用]
      operationId: commonDictGet
      summary: 获取字典项
      description: 用于性格标签、取消原因、异常类型等下拉/多选数据。
      parameters:
        - {name: type, in: path, required: true, schema: {type: string, enum: [pet_personality, cancel_reason, exception_type, refund_reason]}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/DictItem'}}}}

  # ============================ 用户端：认证与账户 ============================
  /user/auth/login:
    post:
      tags: [用户端-认证与账户]
      operationId: userLogin
      summary: 微信授权登录
      description: wx.login 的 code 换 openid；首次登录自动注册；传入 phoneCode 时同时完成手机号绑定。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, description: wx.login 返回的 code}
                phoneCode: {type: string, description: 手机号快捷绑定 code（可选）}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/LoginVO'}}}

  /user/auth/bind-phone:
    post:
      tags: [用户端-认证与账户]
      operationId: userBindPhone
      summary: 绑定手机号
      description: 登录时未携带 phoneCode 的用户后续补绑；需微信手机号授权 code。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneCode]
              properties:
                phoneCode: {type: string, description: 手机号快捷绑定 code}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /user/profile:
    get:
      tags: [用户端-认证与账户]
      operationId: userProfileGet
      summary: 获取我的资料
      responses:
        '200': {description: OK, content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/Result'}, {type: object, properties: {data: {$ref: '#/components/schemas/UserProfileVO'}}}]}}}}
    put:
      tags: [用户端-认证与账户]
      operationId: userProfileUpdate
      summary: 更新我的资料
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: {type: string}
                avatar: {type: string, description: OSS URL}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  # ============================ 用户端：地址与入户方式 ============================
  /user/addresses:
    get:
      tags: [用户端-地址与入户方式]
      operationId: userAddressList
      summary: 地址簿列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/AddressVO'}}}}
    post:
      tags: [用户端-地址与入户方式]
      operationId: userAddressCreate
      summary: 新增地址
      description: 入户方式中的密码/钥匙类信息加密存储，仅服务时段对当单服务师可见。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressSaveDTO'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: integer, format: int64, description: 新地址 id}}}

  /user/addresses/{id}:
    put:
      tags: [用户端-地址与入户方式]
      operationId: userAddressUpdate
      summary: 修改地址
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressSaveDTO'}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}
    delete:
      tags: [用户端-地址与入户方式]
      operationId: userAddressDelete
      summary: 删除地址
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  # ============================ 用户端：宠物档案 ============================
  /user/pets:
    get:
      tags: [用户端-宠物档案]
      operationId: userPetList
      summary: 宠物列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/PetVO'}}}}
    post:
      tags: [用户端-宠物档案]
      operationId: userPetCreate
      summary: 新增宠物档案
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PetSaveDTO'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: integer, format: int64}}}

  /user/pets/{id}:
    get:
      tags: [用户端-宠物档案]
      operationId: userPetGet
      summary: 宠物档案详情
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/PetVO'}}}
    put:
      tags: [用户端-宠物档案]
      operationId: userPetUpdate
      summary: 修改宠物档案
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PetSaveDTO'}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}
    delete:
      tags: [用户端-宠物档案]
      operationId: userPetDelete
      summary: 删除宠物档案
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /user/pets/{id}/vaccinations:
    post:
      tags: [用户端-宠物档案]
      operationId: userPetVaccinationCreate
      summary: 新增疫苗记录
      description: 疫苗记录与疫苗本照片；上传后自动进入宠物健康信息。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VaccinationDTO'}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

# ============================ 用户端：服务与预约 ============================
  /user/services:
    get:
      tags: [用户端-服务与预约]
      operationId: userServiceList
      summary: 服务类目列表
      description: MVP 上线三类：上门喂养、上门洗护、上门医护。
      parameters:
        - {name: category, in: query, schema: {type: string, enum: [FEEDING, GROOMING, MEDICAL]}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ServiceVO'}}}}

  /user/services/{id}:
    get:
      tags: [用户端-服务与预约]
      operationId: userServiceGet
      summary: 服务详情
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/ServiceDetailVO'}}}

  /user/services/price-calc:
    post:
      tags: [用户端-服务与预约]
      operationId: userServicePriceCalc
      summary: 价格试算
      description: 选宠物 → 实时试算（按宠物数量/体重加价）。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PriceCalcDTO'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/PriceCalcVO'}}}

  /user/services/{id}/availability:
    get:
      tags: [用户端-服务与预约]
      operationId: userServiceAvailability
      summary: 查询可用时间窗
      description: 展示服务师可用性；喂养类支持多日连续预约。
      parameters:
        - {$ref: '#/components/parameters/PathId'}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: providerId, in: query, schema: {type: integer, format: int64, description: 指定服务师时传入}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/TimeSlotVO'}}}}

  # ============================ 用户端：服务师 ============================
  /user/providers:
    get:
      tags: [用户端-服务师]
      operationId: userProviderList
      summary: 服务师列表
      parameters:
        - {name: serviceId, in: query, schema: {type: integer, format: int64}}
        - {name: sort, in: query, schema: {type: string, enum: [distance, score], default: score}}
        - {name: longitude, in: query, schema: {type: number, format: double, description: sort=distance 时必传，用户当前定位}}
        - {name: latitude, in: query, schema: {type: number, format: double, description: sort=distance 时必传}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ProviderBriefVO'}}}}

  /user/providers/favorites:
    get:
      tags: [用户端-服务师]
      operationId: userProviderFavorites
      summary: 我的专属服务师（收藏）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ProviderBriefVO'}}}}

  /user/providers/{id}:
    get:
      tags: [用户端-服务师]
      operationId: userProviderGet
      summary: 服务师主页
      description: 真实姓名脱敏展示；含认证徽章、专长标签、服务次数、评分、历史服务相册。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/ProviderDetailVO'}}}

  /user/providers/{id}/reviews:
    get:
      tags: [用户端-服务师]
      operationId: userProviderReviews
      summary: 服务师评价列表
      description: 只展示真实完单评价，支持带图。
      parameters:
        - {$ref: '#/components/parameters/PathId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/ReviewVO'}}}}]}}}

  /user/providers/{id}/favorite:
    post:
      tags: [用户端-服务师]
      operationId: userProviderFavoriteAdd
      summary: 收藏服务师（成为候选专属服务师）
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}
    delete:
      tags: [用户端-服务师]
      operationId: userProviderFavoriteRemove
      summary: 取消收藏
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  # ============================ 用户端：订单与支付 ============================
  /user/orders:
    post:
      tags: [用户端-订单与支付]
      operationId: userOrderCreate
      summary: 提交订单
      description: |
        生成订单并进入待支付（15 分钟支付倒计时）。
        喂养类支持多日连续预约：`days` 传多次日期/时间窗，一次下单 N 天。
        需带 `Idempotency-Key` 请求头。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreateDTO'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/OrderCreateVO'}}}
    get:
      tags: [用户端-订单与支付]
      operationId: userOrderList
      summary: 我的订单列表
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/OrderVO'}}}}]}}}

  /user/orders/{id}:
    get:
      tags: [用户端-订单与支付]
      operationId: userOrderGet
      summary: 订单详情
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/OrderDetailVO'}}}

  /user/orders/{id}/pay:
    post:
      tags: [用户端-订单与支付]
      operationId: userOrderPay
      summary: 微信支付下单
      description: 平台担保交易，完单后 T+1 结算给服务师。需带 `Idempotency-Key`。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/WxPayParamsVO'}}}

  /user/orders/{id}/cancel-preview:
    get:
      tags: [用户端-订单与支付]
      operationId: userOrderCancelPreview
      summary: 取消/退款试算（取消前预览）
      description: 展示可退金额、违约金与规则文案；用户在取消确认弹窗确认后再调 POST /cancel。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/CancelPreviewVO'}}}

  /user/orders/{id}/cancel:
    post:
      tags: [用户端-订单与支付]
      operationId: userOrderCancel
      summary: 取消订单
      description: 按退款规则执行：待支付/待接单免费全额退；已接单且距服务 >4h 免费；≤4h 收 30% 违约金（给服务师）。退款金额与 cancel-preview 试算一致。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: {type: string, description: 字典 cancel_reason}
                remark: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/CancelPreviewVO'}, description: 退款金额与违约金试算}}

  /user/orders/{id}/refund:
    post:
      tags: [用户端-订单与支付]
      operationId: userOrderRefund
      summary: 申请退款
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode: {type: string, description: 字典 refund_reason}
                remark: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /user/orders/{id}/confirm:
    post:
      tags: [用户端-订单与支付]
      operationId: userOrderConfirm
      summary: 确认完成
      description: 用户确认或 72 小时超时自动确认后进入待评价（SETTLING）：T+1 结算入余额，同时开放 72 小时评价入口。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /user/orders/{id}/days:
    get:
      tags: [用户端-订单与支付]
      operationId: userOrderDays
      summary: 多日订单子项列表
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/OrderDayVO'}}}}

  /user/orders/{id}/days/{dayId}:
    put:
      tags: [用户端-订单与支付]
      operationId: userOrderDayUpdate
      summary: 修改某天时间 / 暂停一天
      parameters:
        - {$ref: '#/components/parameters/PathId'}
        - {$ref: '#/components/parameters/PathDayId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: {type: string, enum: [RESCHEDULE, SUSPEND], description: 改时间 / 暂停一天}
                slotBegin: {type: string, example: "14:00"}
                slotEnd: {type: string, example: "15:00"}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  # ============================ 用户端：服务过程 ============================
  /user/orders/{id}/progress:
    get:
      tags: [用户端-服务过程]
      operationId: userOrderProgress
      summary: 服务进度流
      description: 已接单/出发/到达/服务中/完成等节点时间轴。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ProgressNodeVO'}}}}

  /user/orders/{id}/records:
    get:
      tags: [用户端-服务过程]
      operationId: userOrderRecords
      summary: 实时照片/视频流
      description: 含到达打卡（定位 + 时间）与 SOP 各步骤影像，影像带水印；多日订单传 dayId 按天过滤，不传返回全部。
      parameters:
        - {$ref: '#/components/parameters/PathId'}
        - {name: dayId, in: query, schema: {type: integer, format: int64, description: 多日订单子项 id}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/ServiceRecordVO'}}}}]}}}

  /user/orders/{id}/report:
    get:
      tags: [用户端-服务过程]
      operationId: userOrderReport
      summary: 查看服务报告
      description: 结构化报告：进食、饮水、排泄、精神状态、异常观察（勾选 + 描述）+ 照片；异常项高亮并提示「建议就医」。多日订单每天一份：传 dayId 返回当天，不传返回全部。
      parameters:
        - {$ref: '#/components/parameters/PathId'}
        - {name: dayId, in: query, schema: {type: integer, format: int64, description: 多日订单子项 id}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ServiceReportVO'}}}}

  # ============================ 用户端：评价 ============================
  /user/orders/{id}/review:
    post:
      tags: [用户端-评价]
      operationId: userReviewCreate
      summary: 提交评价
      description: 完单后 72 小时内可评（窗口超时未评由定时任务归档为 FINISHED，之后不可再评）；4 个维度星级 + 文字 + 图。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewCreateDTO'}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  # ============================ 用户端：申诉与消息 ============================
  /user/orders/{id}/complaints:
    post:
      tags: [用户端-申诉与消息]
      operationId: userComplaintCreate
      summary: 一键申诉
      description: 订单维度发起，触发结算冻结，客服 24 小时内介入。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, description]
              properties:
                type: {type: string, enum: [PET_ABNORMAL, ENV_ABNORMAL, SERVICE_QUALITY, REFUND_DISPUTE, OTHER]}
                description: {type: string}
                images: {type: array, items: {type: string}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: integer, format: int64, description: 工单 id}}}

  /user/complaints:
    get:
      tags: [用户端-申诉与消息]
      operationId: userComplaintList
      summary: 我的申诉列表
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/ComplaintVO'}}}}]}}}

  /user/subscriptions:
    post:
      tags: [用户端-申诉与消息]
      operationId: userSubscriptionReport
      summary: 上报订阅消息授权结果
      description: 记录用户对派单成功、出发、到达、报告生成、退款进度等一次性订阅的授权结果，服务端据此推送。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templates, accepted]
              properties:
                templates: {type: array, items: {type: string, enum: [DISPATCHED, DEPARTED, ARRIVED, REPORT_READY, REFUND_PROGRESS]}}
                accepted: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  # ============================ 用户端：个人中心 ============================
  /user/home:
    get:
      tags: [用户端-个人中心]
      operationId: userHome
      summary: 个人中心聚合
      description: 我的订单/宠物/服务师/地址入口与角标。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/UserHomeVO'}}}

  /user/entry-credentials/access-logs:
    get:
      tags: [用户端-个人中心]
      operationId: userEntryCredentialLogs
      summary: 入户密码查看记录
      description: 合规要求：向用户展示其入户信息的查看/使用记录。
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/EntryCredentialLogVO'}}}}]}}}

  /user/account/cancellation:
    post:
      tags: [用户端-个人中心]
      operationId: userAccountCancel
      summary: 注销账号
      description: 合规必需；注销前置校验：无进行中订单、无未结清资金。
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

# ============================ 服务师端：入驻与认证 ============================
  /provider/auth/login:
    post:
      tags: [服务师端-入驻与认证]
      operationId: providerLogin
      summary: 微信授权登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, description: wx.login 返回的 code}
                phoneCode: {type: string}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/LoginVO'}}}

  /provider/auth/bind-phone:
    post:
      tags: [服务师端-入驻与认证]
      operationId: providerBindPhone
      summary: 绑定手机号
      description: 登录时未携带 phoneCode 的服务师后续补绑。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneCode]
              properties:
                phoneCode: {type: string, description: 手机号快捷绑定 code}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /provider/applications:
    post:
      tags: [服务师端-入驻与认证]
      operationId: providerApplicationCreate
      summary: 提交入驻申请
      description: 身份证正反面 + 活体人脸核身 + 从业经历与专长。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderApplicationDTO'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: integer, format: int64, description: 申请单 id}}}

  /provider/applications/face-verify:
    post:
      tags: [服务师端-入驻与认证]
      operationId: providerFaceVerify
      summary: 活体人脸核身
      description: 返回第三方核身 SDK 调用参数，核身结果异步回调。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/FaceVerifyVO'}}}

  /provider/applications/current:
    get:
      tags: [服务师端-入驻与认证]
      operationId: providerApplicationCurrent
      summary: 五重认证状态页
      description: 实名、人脸核身、健康证、无犯罪记录、平台培训考核 五项进度透明展示，全部通过后才可接单。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/CertificationStatusVO'}}}

  /provider/certifications:
    post:
      tags: [服务师端-入驻与认证]
      operationId: providerCertificationSubmit
      summary: 提交资质材料
      description: 健康证、职业资格/培训证书（有则加分）、无犯罪记录证明承诺 + 核查。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CertificationSubmitDTO'}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /provider/trainings:
    get:
      tags: [服务师端-入驻与认证]
      operationId: providerTrainingList
      summary: 平台培训课程列表
      description: SOP 课程：喂养 / 洗护 / 医护 / 应急处理。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/TrainingCourseVO'}}}}

  /provider/trainings/{id}/exam:
    post:
      tags: [服务师端-入驻与认证]
      operationId: providerTrainingExam
      summary: 提交培训考试
      description: 考试 ≥80 分通过。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers: {type: array, items: {type: object, properties: {questionId: {type: integer, format: int64}, optionKey: {type: string}}}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/ExamResultVO'}}}

  /provider/agreements/sign:
    post:
      tags: [服务师端-入驻与认证]
      operationId: providerAgreementSign
      summary: 签署电子协议
      description: 合作协议、服务规范、违约责任（电子签名）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agreementType, signature]
              properties:
                agreementType: {type: string, enum: [COOPERATION, SERVICE_STANDARD, LIABILITY]}
                signature: {type: string, description: 电子签名图片 URL}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /provider/deposit/pay:
    post:
      tags: [服务师端-入驻与认证]
      operationId: providerDepositPay
      summary: 缴纳/冻结保证金
      description: 退出满 30 天且无纠纷可退。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: {type: integer, description: 保证金金额（分）}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/WxPayParamsVO'}}}

  # ============================ 服务师端：工作台与接单 ============================
  /provider/workbench/today:
    get:
      tags: [服务师端-工作台与接单]
      operationId: providerWorkbenchToday
      summary: 今日日程
      parameters:
        - {name: date, in: query, schema: {type: string, format: date, description: 默认今天}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ProviderOrderItemVO'}}}}

  /provider/orders/pending:
    get:
      tags: [服务师端-工作台与接单]
      operationId: providerPendingOrders
      summary: 待响应指派单
      description: 指派单需 15 分钟内响应，连续拒单降权。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ProviderOrderItemVO'}}}}

  /provider/orders/{id}/accept:
    post:
      tags: [服务师端-工作台与接单]
      operationId: providerOrderAccept
      summary: 接单
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /provider/orders/{id}/reject:
    post:
      tags: [服务师端-工作台与接单]
      operationId: providerOrderReject
      summary: 拒单
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /provider/schedules:
    get:
      tags: [服务师端-工作台与接单]
      operationId: providerScheduleGet
      summary: 查询排班设置
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/ScheduleSettingVO'}}}
    put:
      tags: [服务师端-工作台与接单]
      operationId: providerScheduleUpdate
      summary: 设置排班
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScheduleSettingDTO'}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /provider/orders/{id}/pet:
    get:
      tags: [服务师端-工作台与接单]
      operationId: providerOrderPet
      summary: 当单宠物档案（只读）
      description: 含喂养指令，服务时自动带入 SOP。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/PetVO'}}}

  /provider/orders/{id}/contact:
    get:
      tags: [服务师端-工作台与接单]
      operationId: providerOrderContact
      summary: 获取用户虚拟号
      description: 全链路虚拟号（隐私号），服务师不可见真实号码。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: object, properties: {virtualPhone: {type: string}, expireAt: {type: string}}}}}

  /provider/orders/{id}/navigation:
    get:
      tags: [服务师端-工作台与接单]
      operationId: providerOrderNavigation
      summary: 获取导航坐标
      description: 一键跳转地图导航至小区；服务时段前不返回完整门牌。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: object, properties: {longitude: {type: number, format: double}, latitude: {type: number, format: double}, community: {type: string}, detailAddress: {type: string, nullable: true, description: 仅服务时段返回完整门牌}}}}}

  # ============================ 服务师端：服务执行 ============================
  /provider/orders/{id}/checkin:
    post:
      tags: [服务师端-服务执行]
      operationId: providerOrderCheckin
      summary: 到达打卡
      description: 含定位与时间；与地址定位偏差 >500m 无法打卡，需走异常上报。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [longitude, latitude]
              properties:
                longitude: {type: number, format: double}
                latitude: {type: number, format: double}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/CheckinVO'}}}

  /provider/orders/{id}/sop:
    get:
      tags: [服务师端-服务执行]
      operationId: providerOrderSop
      summary: 获取 SOP 执行清单
      description: 按服务类型生成：喂养类 = 喂食拍照 / 换水 / 铲屎 / 陪玩 / 门口检查；每步强制拍照（带水印）。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/SopChecklistVO'}}}

  /provider/orders/{id}/records:
    post:
      tags: [服务师端-服务执行]
      operationId: providerOrderRecordUpload
      summary: 上传服务记录（照片/视频）
      description: 每步 SOP 强制拍照，可附 ≤60s 短视频；先经 /common/files/presign 直传 OSS。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sopItemKey, mediaType, url]
              properties:
                sopItemKey: {type: string, description: SOP 步骤标识}
                mediaType: {type: string, enum: [PHOTO, VIDEO]}
                url: {type: string, description: 带水印的 OSS URL}
                longitude: {type: number, format: double}
                latitude: {type: number, format: double}
                remark: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /provider/orders/{id}/report:
    post:
      tags: [服务师端-服务执行]
      operationId: providerOrderReportSubmit
      summary: 提交服务报告
      description: 结构化表单，必填项校验，异常项必填描述。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceReportSubmitDTO'}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /provider/orders/{id}/entry-credential/view:
    post:
      tags: [服务师端-服务执行]
      operationId: providerOrderEntryCredentialView
      summary: 查看入户密码
      description: 仅服务时段内可见，查看行为全量留痕，服务完成即失效。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/EntryCredentialVO'}}}

  /provider/orders/{id}/exceptions:
    post:
      tags: [服务师端-服务执行]
      operationId: providerOrderExceptionReport
      summary: 异常上报
      description: 宠物异常（呕吐/拒食/受伤）、环境异常（跑丢/物品损坏）一键上报，触发平台介入。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, description]
              properties:
                type: {type: string, description: 字典 exception_type}
                description: {type: string}
                images: {type: array, items: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  # ============================ 服务师端：收入与提现 ============================
  /provider/bank-cards:
    get:
      tags: [服务师端-收入与提现]
      operationId: providerBankCardList
      summary: 银行卡列表
      description: 仅返回脱敏卡号；提现申请的 bankCardId 来源于此。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/BankCardVO'}}}}
    post:
      tags: [服务师端-收入与提现]
      operationId: providerBankCardCreate
      summary: 绑定银行卡
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BankCardSaveDTO'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: integer, format: int64, description: 新卡 id}}}

  /provider/bank-cards/{id}:
    delete:
      tags: [服务师端-收入与提现]
      operationId: providerBankCardDelete
      summary: 解绑银行卡
      description: 存在进行中提现单的卡不可解绑。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}
    put:
      tags: [服务师端-收入与提现]
      operationId: providerBankCardSetDefault
      summary: 设为默认卡
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isDefault]
              properties:
                isDefault: {type: boolean}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /provider/wallet:
    get:
      tags: [服务师端-收入与提现]
      operationId: providerWalletGet
      summary: 余额概览
      description: 完单 T+1 入账；含可提现余额、冻结中金额、累计收入。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/WalletVO'}}}

  /provider/wallet/settlements:
    get:
      tags: [服务师端-收入与提现]
      operationId: providerSettlementList
      summary: 收入明细
      description: 每单结算金额、平台服务费明细。
      parameters:
        - {name: begin, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/SettlementVO'}}}}]}}}

  /provider/withdrawals:
    post:
      tags: [服务师端-收入与提现]
      operationId: providerWithdrawalCreate
      summary: 提现申请
      description: 每周提现至银行卡。需带 `Idempotency-Key`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, bankCardId]
              properties:
                amount: {type: integer, description: 提现金额（分）}
                bankCardId: {type: integer, format: int64}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: integer, format: int64, description: 提现单 id}}}
    get:
      tags: [服务师端-收入与提现]
      operationId: providerWithdrawalList
      summary: 提现记录
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/WithdrawalVO'}}}}]}}}

# ============================ 管理后台：认证与权限 ============================
  /admin/auth/login:
    post:
      tags: [管理后台-认证与权限]
      operationId: adminLogin
      summary: 账号密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/AdminLoginVO'}}}

  /admin/auth/logout:
    post:
      tags: [管理后台-认证与权限]
      operationId: adminLogout
      summary: 退出登录
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/me:
    get:
      tags: [管理后台-认证与权限]
      operationId: adminMe
      summary: 当前登录用户与权限
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/AdminProfileVO'}}}

  /admin/staff:
    get:
      tags: [管理后台-认证与权限]
      operationId: adminStaffList
      summary: 后台员工列表
      description: 工单指派（assigneeId）选择客服时使用；仅返回 ACTIVE 员工。
      parameters:
        - {name: roleCode, in: query, schema: {type: string, description: 按角色过滤，如 CUSTOMER_SERVICE}}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/AdminStaffVO'}}}}

  # ============================ 管理后台：订单调度 ============================
  /admin/orders:
    get:
      tags: [管理后台-订单调度]
      operationId: adminOrderList
      summary: 订单池
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/OrderStatus'}}
        - {name: providerId, in: query, schema: {type: integer, format: int64}}
        - {name: keyword, in: query, schema: {type: string, description: 订单号 / 手机号 / 宠物名}}
        - {name: begin, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/AdminOrderVO'}}}}]}}}

  /admin/orders/alerts:
    get:
      tags: [管理后台-订单调度]
      operationId: adminOrderAlerts
      summary: 异常订单告警
      description: 超时未接单、打卡定位偏差、异常上报三类。
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [TIMEOUT_NO_ACCEPT, CHECKIN_DEVIATION, PROVIDER_EXCEPTION, USER_COMPLAINT, PAYMENT_ABNORMAL]}}
        - {name: handled, in: query, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/OrderAlertVO'}}}}]}}}

  /admin/orders/{id}:
    get:
      tags: [管理后台-订单调度]
      operationId: adminOrderGet
      summary: 订单详情
      description: 含服务记录、报告、支付与结算流水、审计留痕。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {$ref: '#/components/schemas/AdminOrderDetailVO'}}}

  /admin/orders/{id}/dispatch:
    post:
      tags: [管理后台-订单调度]
      operationId: adminOrderDispatch
      summary: 派单
      description: 按距离 → 评分 → 当前负载推荐；高危/特殊订单只派给具备对应认证标签的服务师。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId]
              properties:
                providerId: {type: integer, format: int64}
                remark: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/orders/{id}/reassign:
    post:
      tags: [管理后台-订单调度]
      operationId: adminOrderReassign
      summary: 改派
      description: 服务师取消或超时未接时改派；无服务师可接则全额退款 + 补偿券。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerId, reason]
              properties:
                providerId: {type: integer, format: int64}
                reason: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/orders/{id}/cancel:
    post:
      tags: [管理后台-订单调度]
      operationId: adminOrderCancel
      summary: 取消订单
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string}
                refundAll: {type: boolean, default: true}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  /admin/orders/{id}/refund/approve:
    post:
      tags: [管理后台-订单调度]
      operationId: adminOrderRefundApprove
      summary: 退款审批（用户申请的退款）
      description: 审批用户通过 /user/orders/{id}/refund 发起的退款申请；批准后原路退回。
      parameters: [{$ref: '#/components/parameters/PathId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved, amount]
              properties:
                approved: {type: boolean}
                amount: {type: integer, description: 批准退款金额（分）}
                remark: {type: string}
      responses:
        '200': {$ref: '#/components/responses/OkVoid'}

  # ============================ 管理后台：服务师管理 ============================
  /admin/providers:
    get:
      tags: [管理后台-服务师管理]
      operationId: adminProviderList
      summary: 服务师列表
      parameters:
        - {name: keyword, in: query, schema: {type: string}}
        - {name: certStatus, in: query, schema: {type: string, enum: [PENDING, APPROVED, REJECTED]}}
        - {name: status, in: query, schema: {type: string, enum: [PENDING, ACTIVE, SUSPENDED, BANNED, QUIT]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - {type: object, properties: {data: {allOf: [{$ref: '#/components/schemas/PageResult'}, {type: object, properties: {records: {type: array, items: {$ref: '#/components/schemas/AdminProviderVO'}}}}]}}}

